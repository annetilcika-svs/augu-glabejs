<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Augu glābējs</title>
    <!-- bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-gH2yIJqKdNHPEq0n4Mqa/HGKIhSkIHeL5AyhkYV8i59U5AR6csBvApHHNl/vI1Bx"
      crossorigin="anonymous"
    />
    <!-- icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css"
    />

    <link href="style.css" rel="stylesheet" />
  </head>
  <body>
    <div
      class="container-fluid vh-100 d-flex align-items-center justify-content-center"
    >
      <div class="card shadow" id="lielaKaste">
        <div class="row g-0 h-100">
          <div class="col-md-5 d-flex flex-column" id="kreisaKaste">
            <div class="d-flex justify-content-between align-items-start mb-4">
              <h1 class="text-center">Augu glābējs</h1>

              <div class="d-flex">
                <button
                  class="btn btn-outline-light-subtle mb-2"
                  type="button"
                  id="lejupieladet"
                >
                  <i class="bi bi-download"></i>
                </button>

                <button
                  class="btn btn-outline-light-subtle mb-2"
                  type="button"
                  id="dzest"
                >
                  <i class="bi bi-trash3"></i>
                </button>
              </div>
            </div>
            <div class="mb-3">
              <p class="text-center mb-4">
                Šeit parādīsies Jūsu iesūtītais attēls:
              </p>
              <div class="d-flex justify-content-center">
                <div
                  class="card shadow-sm d-flex align-items-center justify-content-center"
                  id="bilde"
                >
                  <!--šeit katkādā veidā būs jādabū iekšā bilde kuras link cilvēks būs ielicis-->
                </div>
              </div>
            </div>

            <div class="row mt-3">
              <div class="col">
                <div class="mb-3">
                  <p class="text-center mb-4">
                    Nosaukums:
                    <span id="auguNosaukums">__________________</span>
                  </p>

                  <!--šeit pēctam pievienosies nosaukums kad mākslīgais intelekts noskaidros kāds tas ir-->
                  <input
                    id="saite"
                    type="text"
                    class="form-control mb-2"
                    placeholder="Ievadiet saiti uz bildi"
                  />
                </div>

                <div class="mb-3">
                  <textarea
                    class="form-control"
                    placeholder="Ievadiet, kas noticis Jūsu augam"
                    id="problema"
                  ></textarea>
                </div>
                <div class="card text-center">
                  <button
                    class="btn btn-outline-light-subtle"
                    type="button"
                    id="btn-pievienot"
                  >
                    Pievienot
                  </button>
                </div>
              </div>
            </div>
          </div>

          <div class="linija"></div>

          <div class="col-md d-flex flex-column" id="labaKaste">
            <h1 class="text-center mb-4">Kopšanas kalendārs</h1>
            <div class="dienuSadalijums">
              <div class="day-card">
                <div>
                  <div>Diena 1</div>
                </div>
                <div class="card-body text-center text-muted py-4">
                  <span id="diena1"></span>
                </div>
              </div>
              <div class="day-card">
                <div>
                  <div>Diena 2</div>
                </div>
                <div class="card-body text-center text-muted py-4">
                  <span id="diena2"></span>
                </div>
              </div>
              <div class="day-card">
                <div>
                  <div>Diena 3</div>
                </div>
                <div class="card-body text-center text-muted py-4">
                  <span id="diena3"></span>
                </div>
              </div>
              <div class="day-card">
                <div>
                  <div>Diena 4</div>
                </div>
                <div class="card-body text-center text-muted py-4">
                  <span id="diena4"></span>
                </div>
              </div>
              <div class="day-card">
                <div>
                  <div>Diena 5</div>
                </div>
                <div class="card-body text-center text-muted py-4">
                  <span id="diena5"></span>
                </div>
              </div>
              <div class="day-card">
                <div>
                  <div>Diena 6</div>
                </div>
                <div class="card-body text-center text-muted py-4">
                  <span id="diena6"></span>
                </div>
              </div>
            </div>
            <div class="day-card">
              <div>
                <div>Apraksts</div>
              </div>
              <div
                class="card-body text-center text-muted py-4"
                id="aprakstsKaste"
              >
                <span id="apraksts"></span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-A3rJD856KowSb7dwlZdYEkO39Gagi7vIsF0jrRAoQmDKKtQBHUuLZ9AsSv4jD4Xa"
      crossorigin="anonymous"
    ></script>

    <script src="script.js"></script>
  </body>
</html>
